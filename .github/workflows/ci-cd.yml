name: CI / CD

on:
  push:
    branches: [main, release/v1.2]
  pull_request:
    branches: [main, release/v1.2]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-cd-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  compile:
    name: Build frontend and compile/check source
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'
      - name: Install frontend dependencies
        run: npm ci --prefix frontend --legacy-peer-deps --no-audit --no-fund
      - name: Compile React production bundle
        run: npm run build --prefix frontend
      - name: Check Node.js source syntax
        run: find backend/src backend/scripts docker scripts -type f \( -name '*.js' -o -name '*.cjs' \) -print0 | xargs -0 -r -n1 node --check
      - name: Compile Python source
        run: python -m compileall -q behavioral-auth-ml-service/backend
      - name: Validate Compose and deployment scripts
        run: |
          docker compose config --quiet
          BIOAUTH_IMAGE=biometrics-ci:validation docker compose -f docker-compose.deploy.yml config --quiet
          for script in scripts/deploy.sh scripts/deploy-ssh.sh; do bash -n "$script"; done
      - name: Test deployment failure handling and rollback
        run: python scripts/test_deploy.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: frontend-production-bundle
          path: frontend/dist/
          retention-days: 7

  build:
    name: Build the BioAuth image
    needs: compile
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - name: Build image once for testing and publishing
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: Dockerfile
          load: true
          platforms: linux/amd64
          tags: biometrics-ci:${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=bioauth
          cache-to: type=gha,mode=max,scope=bioauth
      - name: Export image
        env:
          REVISION: ${{ github.sha }}
        run: docker save "biometrics-ci:$REVISION" -o "$RUNNER_TEMP/bioauth.tar"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: bioauth-image
          path: ${{ runner.temp }}/bioauth.tar
          retention-days: 2
          compression-level: 1

  test:
    name: Integration and persistence tests
    needs: build
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    env:
      IMAGE_TAG: ${{ github.sha }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: bioauth-image
          path: ${{ runner.temp }}
      - name: Load the built image
        run: docker load -i "$RUNNER_TEMP/bioauth.tar"
      - name: Install smoke-test client
        run: npm ci --prefix frontend --legacy-peer-deps --no-audit --no-fund
      - name: Run the image and verify integration and persistence
        run: |
          start_bioauth() {
            docker run -d --name bioauth-ci -p 127.0.0.1:8080:8080 -v bioauth-ci-data:/var/lib/bioauth "biometrics-ci:$IMAGE_TAG"
            timeout 180 bash -c 'until [ "$(docker inspect -f "{{.State.Health.Status}}" bioauth-ci)" = healthy ]; do
              [ "$(docker inspect -f "{{.State.Running}}" bioauth-ci)" = true ] || exit 1
              sleep 2
            done'
          }
          start_bioauth
          node scripts/smoke-test.cjs
          node scripts/demo-smoke-test.cjs
          docker exec -e MONGO_URI=mongodb://127.0.0.1:27017/lms_demo -w /app/backend bioauth-ci node scripts/test-seed-demo.js
          docker exec bioauth-ci python behavioral-auth-ml-service/backend/test_saas_platform.py
          docker stop --time 30 bioauth-ci
          docker rm bioauth-ci
          start_bioauth
          node scripts/smoke-test.cjs --persistence
          node scripts/demo-smoke-test.cjs
      - name: Capture diagnostics
        if: failure()
        run: |
          mkdir -p artifacts
          docker ps --all > artifacts/container-status.txt
          docker logs bioauth-ci > artifacts/container.log 2>&1 || true
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: failure()
        with:
          name: container-diagnostics
          path: artifacts/
          retention-days: 7
      - name: Clean up the test container
        if: always()
        run: |
          docker rm -f bioauth-ci || true
          docker volume rm bioauth-ci-data || true

  publish:
    name: Publish tested images and release bundle
    needs: [compile, test]
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    env:
      DOCKERHUB_USERNAME: ${{ vars.DOCKERHUB_USERNAME }}
      REVISION: ${{ github.sha }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: bioauth-image
          path: ${{ runner.temp }}
      - name: Check Docker Hub namespace
        shell: bash
        run: |
          if [[ ! "$DOCKERHUB_USERNAME" =~ ^[a-z0-9]+$ ]]; then
            echo "::error::Set the DOCKERHUB_USERNAME repository variable to your Docker Hub username."
            exit 1
          fi
      - name: Sign in to Docker Hub
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          username: ${{ env.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Push the tested image and record its digest
        shell: bash
        run: |
          set -euo pipefail
          image="docker.io/$DOCKERHUB_USERNAME/biometrics-authentication"
          docker load -i "$RUNNER_TEMP/bioauth.tar"
          docker tag "biometrics-ci:$REVISION" "$image:sha-$REVISION"
          docker push "$image:sha-$REVISION"
          digest=$(docker image inspect "$image:sha-$REVISION" --format '{{index .RepoDigests 0}}')
          docker tag "$image:sha-$REVISION" "$image:1.2"
          docker push "$image:1.2"
          docker tag "$image:sha-$REVISION" "$image:latest"
          docker push "$image:latest"
          mkdir -p release
          printf 'RELEASE_SHA=%s\nBIOAUTH_IMAGE=%s\n' "$REVISION" "$digest" > release/release.env
          cp docker-compose.deploy.yml release/compose.yml
          cp scripts/deploy.sh release/deploy.sh
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: deployment-bundle
          path: release/
          retention-days: 30

  deploy:
    name: Deploy to production and check health
    needs: publish
    if: vars.DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    environment:
      name: production
      url: ${{ vars.DEPLOY_URL }}
    concurrency:
      group: biometrics-production
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: deployment-bundle
          path: release/
      - name: Transfer release and deploy through SSH
        env:
          DEPLOY_HOST: ${{ vars.DEPLOY_HOST }}
          DEPLOY_USER: ${{ vars.DEPLOY_USER }}
          DEPLOY_PORT: ${{ vars.DEPLOY_PORT || '22' }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
          DEPLOY_DOCKERHUB_USERNAME: ${{ vars.DEPLOY_DOCKERHUB_USERNAME }}
          DEPLOY_DOCKERHUB_TOKEN: ${{ secrets.DEPLOY_DOCKERHUB_TOKEN }}
          REVISION: ${{ github.sha }}
          DEPLOYMENT_ID: ${{ github.run_id }}-${{ github.run_attempt }}
        run: bash scripts/deploy-ssh.sh release
      - name: Check public application endpoints
        if: vars.DEPLOY_URL != ''
        env:
          DEPLOY_URL: ${{ vars.DEPLOY_URL }}
        run: |
          curl --fail --silent --show-error --retry 5 --retry-all-errors --retry-delay 5 "${DEPLOY_URL%/}/api/health"
          curl --fail --silent --show-error --retry 5 --retry-all-errors --retry-delay 5 "${DEPLOY_URL%/}/bio-api/v1/system/health"
