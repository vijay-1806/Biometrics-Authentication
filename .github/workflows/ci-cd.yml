name: CI / CD

on:
  push:
    branches: [release/v1.2]
  pull_request:
    branches: [release/v1.2]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-cd-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  verify:
    name: Build and test the Compose stack
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install smoke-test client
        run: npm ci --prefix frontend --legacy-peer-deps --no-audit --no-fund
      - name: Validate Compose
        run: docker compose config --quiet
      - name: Build and start all services
        run: docker compose up --build --detach --wait --wait-timeout 240
      - name: Test UI, authentication, WebSockets, and biometrics
        run: node scripts/smoke-test.cjs
      - name: Test customer workspaces and tenant access
        run: docker compose exec -T ml python behavioral-auth-ml-service/backend/test_saas_platform.py
      - name: Check persistence after service recreation
        run: |
          docker compose up --detach --force-recreate --wait --wait-timeout 180 backend ml frontend
          node scripts/smoke-test.cjs --persistence
      - name: Capture service diagnostics
        if: always()
        run: |
          mkdir -p artifacts
          docker compose ps --all > artifacts/compose-status.txt
          docker compose logs --no-color > artifacts/compose.log 2>&1
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: failure()
        with:
          name: compose-diagnostics
          path: artifacts/
          retention-days: 7
      - name: Remove test containers and data
        if: always()
        run: docker compose down --volumes --remove-orphans

  publish:
    name: Publish ${{ matrix.service }} image
    needs: verify
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/release/v1.2'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - service: frontend
            dockerfile: frontend/Dockerfile
          - service: backend
            dockerfile: backend/Dockerfile
          - service: ml
            dockerfile: behavioral-auth-ml-service/Dockerfile
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Set image name
        id: image
        shell: bash
        env:
          REPOSITORY: ${{ github.repository }}
          SERVICE: ${{ matrix.service }}
        run: echo "name=ghcr.io/${REPOSITORY,,}-$SERVICE" >> "$GITHUB_OUTPUT"
      - name: Build and publish verified revision
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: true
          platforms: linux/amd64
          tags: |
            ${{ steps.image.outputs.name }}:1.2
            ${{ steps.image.outputs.name }}:sha-${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}
          provenance: mode=min
