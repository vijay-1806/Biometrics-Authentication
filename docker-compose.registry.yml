# Optional overlay: run published images instead of building on this machine.
# docker compose -f docker-compose.yml -f docker-compose.registry.yml up -d --no-build --pull always --wait
services:
  frontend:
    pull_policy: missing
    image: docker.io/${DOCKERHUB_USERNAME:?Set DOCKERHUB_USERNAME to the image publisher}/biometrics-authentication-frontend:${IMAGE_TAG:-1.2}
  backend:
    pull_policy: missing
    image: docker.io/${DOCKERHUB_USERNAME:?Set DOCKERHUB_USERNAME to the image publisher}/biometrics-authentication-backend:${IMAGE_TAG:-1.2}
  ml:
    pull_policy: missing
    image: docker.io/${DOCKERHUB_USERNAME:?Set DOCKERHUB_USERNAME to the image publisher}/biometrics-authentication-ml:${IMAGE_TAG:-1.2}
